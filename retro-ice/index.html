<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<title>Retro Ice</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;overscroll-behavior:none}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}#app{position:fixed;inset:0;overflow:hidden;background:#050505}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}#joy{position:absolute;z-index:20;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:98px;height:98px;border-radius:50%;background:rgba(24,27,31,.58);border:4px solid rgba(255,255,255,.38);touch-action:none}#joy:before,#joy:after{content:"";position:absolute;background:rgba(255,255,255,.18)}#joy:before{left:49%;top:11%;width:2px;height:78%}#joy:after{top:49%;left:11%;width:78%;height:2px}#knob{position:absolute;width:42px;height:42px;left:24px;top:24px;border-radius:50%;background:#22272d;border:4px solid #090909;pointer-events:none}.actions{position:absolute;z-index:20;right:max(18px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:52px 58px;grid-template-rows:48px 58px;gap:8px;align-items:end}.action{border-radius:50%;border:4px solid #252525;color:#fff;font:1000 10px ui-monospace,SFMono-Regular,Menlo,monospace;text-shadow:0 2px #000;box-shadow:inset 0 -4px rgba(0,0,0,.25);touch-action:none}.action:active{transform:scale(.94)}#truck{grid-column:2;grid-row:1;width:48px;height:48px;background:#266bc4;justify-self:end}#pass{grid-column:1;grid-row:2;width:54px;height:54px;background:#2f9d4d}#shoot{grid-column:2;grid-row:2;width:62px;height:62px;background:#dc3a42;font-size:11px}.power{position:absolute;z-index:20;right:92px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 4px));width:74px;height:7px;border:2px solid rgba(255,255,255,.72);background:rgba(0,0,0,.5);overflow:hidden}.fill{height:100%;width:0;background:#f4ca42}.pauseMenu{position:absolute;inset:0;z-index:40;background:rgba(5,8,11,.84);display:flex;align-items:center;justify-content:center;padding:16px}.hidden{display:none!important}.menu{width:min(320px,84%);background:#16212b;color:#fff;border:4px solid #fff;box-shadow:8px 8px #000;padding:16px;text-align:center}.menu h2{margin:0 0 10px}.menu button{display:block;width:100%;min-height:44px;margin-top:8px;border:3px solid #fff;background:#273a4c;color:#fff;font:1000 14px ui-monospace,SFMono-Regular,Menlo,monospace}.menu .primary{background:#2369b5}.rotateHint{position:absolute;inset:0;z-index:30;pointer-events:none;display:none;align-items:center;justify-content:center;background:rgba(5,8,11,.78);color:#fff;text-align:center;padding:20px;font-weight:1000;font-size:18px}.rotateHint span{display:block;font-size:42px;margin-bottom:8px}@media(orientation:portrait){.rotateHint{display:flex}#joy,.actions,.power{opacity:.15}}@media(max-height:430px){#joy{width:86px;height:86px}#knob{width:38px;height:38px;left:20px;top:20px}.actions{gap:5px}#truck{width:43px;height:43px}#pass{width:48px;height:48px}#shoot{width:56px;height:56px}}
</style>
</head>
<body>
<div id="app" tabindex="0">
<canvas id="game" width="1280" height="720" aria-label="Retro hockey game"></canvas>
<div id="joy"><div id="knob"></div></div>
<div class="actions"><button id="truck" class="action">TRUCK</button><button id="pass" class="action">PASS</button><button id="shoot" class="action">SHOOT</button></div>
<div class="power"><div id="fill" class="fill"></div></div>
<div id="pauseMenu" class="pauseMenu hidden"><div class="menu"><h2>PAUSED</h2><button id="resume" class="primary">RESUME</button><button id="restart">RESTART</button><button id="quit">QUIT</button></div></div>
<div class="rotateHint"><div><span>↻</span>TURN YOUR PHONE SIDEWAYS<br><small>The game starts automatically.</small></div></div>
</div>
<script>
(()=>{
const app=document.getElementById('app'),c=document.getElementById('game'),g=c.getContext('2d');
g.imageSmoothingEnabled=false;
const joy=document.getElementById('joy'),knob=document.getElementById('knob'),fill=document.getElementById('fill'),pauseMenu=document.getElementById('pauseMenu');
const VW=1280,VH=720,WORLD=2300,ice={left:100,right:2200,top:170,bottom:670};
let jx=0,jy=0,jid=null,scoreB=0,scoreR=0,time=180,paused=false,ended=false,last=performance.now(),control=0,charging=false,chargeStart=0,cameraX=0,shake=0;
const puck={x:575,y:420,vx:0,vy:0,free:false,team:'b',idx:0};
const BLUE='#1467c3',BD='#083b78',RED='#cf3138',RD='#761b20',SKIN='#e7b185',STICK='#65452d',BLACK='#141414',WHITE='#f5f5f5';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function P(team,i,x,y,num,role='skater'){return{team,i,x,y,hx:x,hy:y,num,role,dx:team==='b'?1:-1,dy:0,speed:role==='goalie'?105:205,stun:0,truck:0,phase:Math.random()*6.28};}
const blue=[P('b',0,575,420,9),P('b',1,690,300,12),P('b',2,690,535,21),P('b',3,430,310,4),P('b',4,430,525,7),P('b',5,175,420,30,'goalie')];
const red =[P('r',0,1640,420,19),P('r',1,1530,300,16),P('r',2,1530,535,24),P('r',3,1780,310,5),P('r',4,1780,525,8),P('r',5,2125,420,31,'goalie')];
const team=t=>t==='b'?blue:red;function owner(){return puck.free?null:team(puck.team)[puck.idx]}function setOwner(t,i){puck.free=false;puck.team=t;puck.idx=i;if(t==='b')control=i}
function fmt(){let s=Math.max(0,Math.ceil(time));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function reset(face='b'){
 const bp=[[575,420],[690,300],[690,535],[430,310],[430,525],[175,420]],rp=[[1640,420],[1530,300],[1530,535],[1780,310],[1780,525],[2125,420]];
 blue.forEach((p,i)=>Object.assign(p,{x:bp[i][0],y:bp[i][1],hx:bp[i][0],hy:bp[i][1],stun:0,truck:0}));red.forEach((p,i)=>Object.assign(p,{x:rp[i][0],y:rp[i][1],hx:rp[i][0],hy:rp[i][1],stun:0,truck:0}));
 control=0;setOwner(face==='b'?'b':'r',face==='b'?0:0);puck.x=face==='b'?594:1620;puck.y=420;puck.vx=0;puck.vy=0;cameraX=clamp(blue[control].x-VW*.38,0,WORLD-VW);
}
function fullReset(){scoreB=0;scoreR=0;time=180;ended=false;paused=false;reset('b')}
function passPuck(){const o=owner();if(paused||ended||!o||o.team!=='b'||o.role==='goalie')return;let ax=jx,ay=jy;if(Math.hypot(ax,ay)<.18){ax=o.dx;ay=o.dy}let best=null,bestDot=-2;blue.forEach(p=>{if(p.i===o.i||p.role==='goalie')return;const dx=p.x-o.x,dy=p.y-o.y,n=Math.hypot(dx,dy)||1,dot=(dx/n)*ax+(dy/n)*ay;if(dot>bestDot){bestDot=dot;best=p}});if(!best)return;const dx=best.x-o.x,dy=best.y-o.y,n=Math.hypot(dx,dy)||1;puck.free=true;puck.x=o.x;puck.y=o.y;puck.vx=dx/n*560;puck.vy=dy/n*560;control=best.i}
function truck(){if(paused||ended)return;const p=blue[control];if(p.role==='goalie')return;p.truck=.28;shake=4;red.forEach(r=>{if(r.role==='goalie'||r.stun>0)return;if(dist(p,r)<62){r.stun=1.05;const dx=r.x-p.x,dy=r.y-p.y,n=Math.hypot(dx,dy)||1;r.x+=dx/n*44;r.y+=dy/n*44;if(!puck.free&&puck.team==='r'&&puck.idx===r.i){puck.free=true;puck.x=r.x;puck.y=r.y;puck.vx=dx/n*220;puck.vy=dy/n*220}}})}
function startShot(){const o=owner();if(paused||ended||!o||o.team!=='b')return;charging=true;chargeStart=performance.now()}
function releaseShot(){if(!charging)return;charging=false;const o=owner();fill.style.width='0%';if(!o||o.team!=='b')return;const power=Math.min(1,(performance.now()-chargeStart)/1100);let ax=jx,ay=jy;if(Math.hypot(ax,ay)<.18){ax=o.dx;ay=o.dy}const n=Math.hypot(ax,ay)||1;puck.free=true;puck.x=o.x+ax*24;puck.y=o.y+ay*24;puck.vx=ax/n*(470+680*power);puck.vy=ay/n*(470+680*power);if(power>.75)shake=6}
function score(t){if(t==='b')scoreB++;else scoreR++;shake=9;if(scoreB>=5||scoreR>=5){ended=true;paused=true;pauseMenu.classList.remove('hidden');pauseMenu.querySelector('h2').textContent=(scoreB>scoreR?'BLUE WINS':'RED WINS')+' '+scoreB+'-'+scoreR;return}reset(t==='b'?'r':'b')}
function update(dt){if(paused||ended)return;time-=dt;if(time<=0){time=0;ended=true;paused=true;pauseMenu.classList.remove('hidden');pauseMenu.querySelector('h2').textContent=(scoreB===scoreR?'TIE GAME':scoreB>scoreR?'BLUE WINS':'RED WINS')+' '+scoreB+'-'+scoreR;return}if(charging)fill.style.width=(Math.min(1,(performance.now()-chargeStart)/1100)*100)+'%';
 const p=blue[control],m=Math.hypot(jx,jy);if(p.stun<=0&&m>.06){const nx=jx/m,ny=jy/m;p.dx=nx;p.dy=ny;p.x=clamp(p.x+nx*p.speed*dt,ice.left+40,ice.right-40);p.y=clamp(p.y+ny*p.speed*dt,ice.top+30,ice.bottom-30)}if(p.truck>0)p.truck-=dt;
 [...blue,...red].forEach(q=>{q.phase+=dt*9;if(q.stun>0)q.stun-=dt});
 blue.forEach((b,i)=>{if(i===control||b.role==='goalie')return;const own=owner();let tx=b.hx,ty=b.hy;if(own&&own.team==='b'){tx=clamp(own.x+(i%2?130:-120),ice.left+130,ice.right-130);ty=clamp(b.hy+(own.y-b.hy)*.22,ice.top+55,ice.bottom-55)}b.x+=clamp(tx-b.x,-1,1)*78*dt;b.y+=clamp(ty-b.y,-1,1)*78*dt});
 red.forEach(r=>{if(r.role==='goalie'||r.stun>0)return;const t=owner()||puck,dx=t.x-r.x,dy=t.y-r.y,n=Math.hypot(dx,dy)||1;r.x=clamp(r.x+dx/n*r.speed*.55*dt,ice.left+45,ice.right-45);r.y=clamp(r.y+dy/n*r.speed*.55*dt,ice.top+35,ice.bottom-35)});
 const chaseY=puck.free?puck.y:(owner()?.y||420);blue[5].y=clamp(blue[5].y+clamp(chaseY-blue[5].y,-1,1)*120*dt,355,485);red[5].y=clamp(red[5].y+clamp(chaseY-red[5].y,-1,1)*120*dt,355,485);
 const o=owner();if(o){puck.x=o.x+o.dx*22;puck.y=o.y+o.dy*20}else{puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;puck.vx*=Math.pow(.42,dt);puck.vy*=Math.pow(.42,dt);if(puck.y<ice.top+8){puck.y=ice.top+8;puck.vy=Math.abs(puck.vy)*.7}if(puck.y>ice.bottom-8){puck.y=ice.bottom-8;puck.vy=-Math.abs(puck.vy)*.7}blue.forEach((b,i)=>{if(b.role!=='goalie'&&dist(b,puck)<26&&Math.hypot(puck.vx,puck.vy)<620)setOwner('b',i)});red.forEach((r,i)=>{if(r.role!=='goalie'&&dist(r,puck)<26&&Math.hypot(puck.vx,puck.vy)<520)setOwner('r',i)})}
 if(!puck.free&&puck.team==='b'){const o2=owner();red.forEach(r=>{if(r.role!=='goalie'&&r.stun<=0&&dist(r,o2)<29)setOwner('r',r.i)})}if(!puck.free&&puck.team==='r'){const o2=owner();blue.forEach((b,i)=>{if(b.role!=='goalie'&&dist(b,o2)<27)setOwner('b',i)})}
 if(puck.free&&dist(red[5],puck)<34){puck.vx=-Math.abs(puck.vx)*.85;puck.vy+=(puck.y-red[5].y)*5;shake=3}if(puck.free&&dist(blue[5],puck)<34){puck.vx=Math.abs(puck.vx)*.85;puck.vy+=(puck.y-blue[5].y)*5}
 if(puck.free&&puck.x>ice.right-8&&puck.y>365&&puck.y<475)score('b');if(puck.free&&puck.x<ice.left+8&&puck.y>365&&puck.y<475)score('r');
 const desired=clamp(blue[control].x-VW*.38,0,WORLD-VW);cameraX+=(desired-cameraX)*Math.min(1,dt*5.5);if(shake>0)shake=Math.max(0,shake-dt*24)}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}function line(x1,y1,x2,y2,col,w=3){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function skater(p){const main=p.team==='b'?BLUE:RED,dark=p.team==='b'?BD:RD;g.save();g.translate(Math.round(p.x),Math.round(p.y));if(p.stun>0)g.rotate(Math.sin(p.phase*3)*.17);const s=Math.sin(p.phase)*3;
 rect(-10,-31,20,7,dark);rect(-8,-24,16,7,SKIN);rect(-12,-19,24,7,dark);rect(-16,-13,32,24,main);rect(-13,-8,26,6,dark);rect(-22,-11,8,19,main);rect(14,-11,8,19,main);rect(-22,6,8,6,BLACK);rect(14,6,8,6,BLACK);rect(-13,11,11,17,BLACK);rect(3,11,11,17,BLACK);rect(-15,27+s,13,5,BLACK);rect(2,27-s,13,5,BLACK);line(18,2,28,21,STICK,4);line(28,21,41,23,STICK,4);g.fillStyle=WHITE;g.font='bold 12px monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(p.num,0,-1);if(p.team==='b'&&p.i===control){g.strokeStyle='#f1d442';g.lineWidth=4;g.beginPath();g.ellipse(0,34,25,8,0,0,Math.PI*2);g.stroke()}if(p.truck>0){g.strokeStyle='#f0a43a';g.lineWidth=5;g.beginPath();g.arc(0,0,38,0,Math.PI*2);g.stroke()}g.restore()}
function goalie(p){const main=p.team==='b'?BLUE:RED,dark=p.team==='b'?BD:RD;g.save();g.translate(p.x,p.y);rect(-14,-36,28,9,dark);rect(-11,-27,22,9,SKIN);rect(-20,-18,40,28,main);rect(-25,-10,9,24,main);rect(16,-10,9,24,main);rect(-22,10,18,30,WHITE);rect(5,10,18,30,WHITE);rect(-24,38,20,6,BLACK);rect(5,38,20,6,BLACK);rect(-9,-23,18,4,'#d7d7d7');line(22,2,33,28,STICK,5);line(33,28,47,28,STICK,5);g.fillStyle=WHITE;g.font='bold 12px monospace';g.textAlign='center';g.fillText(p.num,0,0);g.restore()}
function crowd(){rect(cameraX,55,VW,78,'#222a31');const cols=['#1766b9','#c63236','#e0ad80','#efefef','#242424','#d36d33'];for(let r=0;r<4;r++)for(let i=0;i<70;i++){const x=cameraX+i*20+(r%2)*9,y=60+r*18;rect(x,y,8,8,cols[(i+r*3)%cols.length]);rect(x+1,y+8,7,7,cols[(i*2+r)%cols.length])}}
function rink(){rect(0,0,WORLD,VH,'#0a0a0a');rect(0,0,WORLD,55,'#050505');crowd();rect(0,133,WORLD,24,'#e8edf0');rect(ice.left,ice.top,ice.right-ice.left,ice.bottom-ice.top,'#dceff7');for(let y=ice.top;y<ice.bottom;y+=22)rect(ice.left,y,ice.right-ice.left,22,(Math.floor(y/22)%2)?'#d9edf5':'#e2f3f8');rect(1148,ice.top,6,ice.bottom-ice.top,'#d94c52');rect(700,ice.top,6,ice.bottom-ice.top,'#367bd0');rect(1595,ice.top,6,ice.bottom-ice.top,'#367bd0');g.strokeStyle='#d85c62';g.lineWidth=5;[[285,420],[2015,420]].forEach(a=>{g.beginPath();g.arc(a[0],a[1],80,0,Math.PI*2);g.stroke()});g.strokeStyle='#4d88d7';g.beginPath();g.arc(1150,420,88,0,Math.PI*2);g.stroke();g.strokeStyle='#d94c52';g.lineWidth=7;g.strokeRect(ice.left-8,365,30,110);g.strokeRect(ice.right-22,365,30,110);rect(ice.left+18,380,38,80,'rgba(74,151,219,.2)');rect(ice.right-56,380,38,80,'rgba(74,151,219,.2)')}
function draw(){const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;g.save();g.translate(-cameraX+sx,sy);rink();blue.forEach(p=>p.role==='goalie'?goalie(p):skater(p));red.forEach(p=>p.role==='goalie'?goalie(p):skater(p));rect(puck.x-7,puck.y-4,14,8,BLACK);g.restore();rect(0,0,VW,54,'#050505');g.fillStyle=WHITE;g.font='bold 27px monospace';g.textBaseline='middle';g.textAlign='left';g.fillText('BLU '+scoreB+'   RED '+scoreR,18,28);g.textAlign='center';g.fillText('1st Prd  '+fmt(),VW/2,28);g.textAlign='right';g.fillText('PAUSE Ⅱ',VW-18,28)}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function setJoy(cx,cy){const r=joy.getBoundingClientRect(),x0=r.left+r.width/2,y0=r.top+r.height/2;let dx=cx-x0,dy=cy-y0,max=r.width*.27,m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max}jx=dx/max;jy=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)setJoy(e.clientX,e.clientY)});function stopJoy(e){if(jid!==null&&(!e||e.pointerId===jid)){jid=null;jx=0;jy=0;knob.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',stopJoy);joy.addEventListener('pointercancel',stopJoy);
document.getElementById('pass').addEventListener('pointerdown',e=>{e.preventDefault();passPuck()});document.getElementById('truck').addEventListener('pointerdown',e=>{e.preventDefault();truck()});const shoot=document.getElementById('shoot');shoot.addEventListener('pointerdown',e=>{e.preventDefault();startShot()});shoot.addEventListener('pointerup',e=>{e.preventDefault();releaseShot()});shoot.addEventListener('pointercancel',releaseShot);
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;if(y<70&&x>1080){paused=true;pauseMenu.classList.remove('hidden');pauseMenu.querySelector('h2').textContent='PAUSED'}});
document.getElementById('resume').addEventListener('click',()=>{paused=false;pauseMenu.classList.add('hidden')});document.getElementById('restart').addEventListener('click',()=>{fullReset();pauseMenu.classList.add('hidden');pauseMenu.querySelector('h2').textContent='PAUSED'});document.getElementById('quit').addEventListener('click',()=>{paused=true;pauseMenu.classList.add('hidden')});
app.addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P')passPuck();if(e.key==='t'||e.key==='T')truck();if(e.code==='Space'&&!charging)startShot()});app.addEventListener('keyup',e=>{if(e.code==='Space')releaseShot()});
fullReset();draw();requestAnimationFrame(loop);app.focus();
})();
</script>
</body>
</html>
